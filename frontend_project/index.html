<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/RamCart_logo_v2.png" />
    <link rel="apple-touch-icon" href="/RamCart_brand_logo_v2.png" />
    <meta name="theme-color" content="#f23e70" />
    
    <!-- SEO & Metadata -->
    <title>RamCart — Modern Fashion & Lifestyle Store</title>
    <meta
      name="description"
      content="Discover the latest in modern fashion, apparel, and lifestyle essentials at RamCart. Enjoy free shipping above ₹499, hassle-free returns, and 100% secure checkout."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ecommerce-website-dfd55.web.app/" />

    <!-- Open Graph Social Metadata -->
    <meta property="og:site_name" content="RamCart" />
    <meta property="og:title" content="RamCart — Modern Fashion & Lifestyle Store" />
    <meta property="og:description" content="Discover the latest in modern fashion, apparel, and lifestyle essentials at RamCart. Free delivery above ₹499, easy returns, and secure checkout." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ecommerce-website-dfd55.web.app/" />
    <meta property="og:image" content="/RamCart_brand_logo_v2.png" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RamCart — Modern Fashion & Lifestyle Store" />
    <meta name="twitter:description" content="Discover the latest in modern fashion, apparel, and lifestyle essentials at RamCart. Free delivery above ₹499, easy returns, and secure checkout." />
    <meta name="twitter:image" content="/RamCart_brand_logo_v2.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://ecommerce-website-dfd55.web.app/#organization",
          "name": "RamCart",
          "url": "https://ecommerce-website-dfd55.web.app",
          "logo": "https://ecommerce-website-dfd55.web.app/RamCart_brand_logo_v2.png",
          "sameAs": [
            "https://github.com/ramtechnow/RamCart_Ecommerce_webpage"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://ecommerce-website-dfd55.web.app/#website",
          "url": "https://ecommerce-website-dfd55.web.app",
          "name": "RamCart",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://ecommerce-website-dfd55.web.app/catalog?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    
    <!-- Google Fonts Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
