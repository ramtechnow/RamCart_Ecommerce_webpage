name: Build & Deploy to Firebase Hosting

on:
  push:
    branches:
      - Ecommerce_backend

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend_project/package-lock.json

      - name: Install dependencies
        working-directory: frontend_project
        run: npm ci

      - name: Build project
        working-directory: frontend_project
        run: npm run build

      - name: Deploy to Firebase Hosting
        working-directory: frontend_project
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project ecommerce-website-dfd55
