name: Render Backend 24/7 Keep-Alive

on:
  schedule:
    # Run every 10 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    name: Keep Render Web Service Awake
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging Render backend at $(date -u)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 35 "https://frontend-project-jucn.onrender.com/health" || echo "000")
          echo "Render HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 503 ]; then
            echo "✅ Render backend is active and responding!"
          else
            echo "⚠️ Health returned $HTTP_STATUS, pinging root / endpoint as fallback..."
            curl -s -o /dev/null -w "%{http_code}" --max-time 35 "https://frontend-project-jucn.onrender.com/" || true
          fi
